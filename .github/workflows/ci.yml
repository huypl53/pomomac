name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Swift on macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app
        run: ./build.sh release

      - name: Verify bundle
        run: |
          test -x Pomodoro.app/Contents/MacOS/Pomodoro
          test -f Pomodoro.app/Contents/Info.plist
          codesign --verify --deep --strict Pomodoro.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Pomodoro.app/Contents/Info.plist
